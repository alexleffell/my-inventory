<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Labels · Maker Inventory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🏷️</text></svg>" />
<meta name="theme-color" content="#0d0b09" />
<style>
  :root {
    color-scheme: dark;
    /* surfaces — carbon black with a faint ember warmth */
    --bg: #0d0b09; --panel: #14110e; --panel2: #1c1815; --panel3: #262019;
    --line: #2b241d; --line2: #3e352b; --line3: #574a3b;
    --text: #f2ede5; --dim: #a89e8f; --dim2: #d3cabd; --faint: #776d5f;
    --orange: #f97b16; --orange2: #fb923c; --ember: #ea6a0e;
    --orangefg: #ffbb77; --on-orange: #201004;
    --amberfg: #e8bd7d;
    --red: #da3633; --redbg: #f8514922; --redfg: #ff8a82;
    --warnfg: #e8c34e; --warnbg: #e3b34112; --warnline: #e3b34152;
    --focus: #ffab5c;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --shadow-2: 0 2px 8px #0009, 0 20px 48px -16px #000e;
    --r-ctl: 10px; --r-card: 14px;
    /* label sheet geometry: US letter, .5in margins, 4 x 5 tiles */
    --tile-w: 1.875in; --tile-h: 2in; --qr: 1.35in;
  }
  * { box-sizing: border-box; }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 100;
                 background: linear-gradient(90deg, var(--ember), var(--orange) 45%, #ffc078); pointer-events: none; }
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
         -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  a { color: var(--orangefg); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .toolbar { max-width: 8.5in; margin: 0 auto; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); }
  .toolbar .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar h1 { font-size: 18px; margin: 0; flex: 1; }
  .toolbar p { margin: 8px 0 0; color: var(--dim); font-size: 14px; overflow-wrap: anywhere; }
  .toolbar code { font-family: var(--mono); color: var(--amberfg); }
  .btn { min-height: 44px; border-radius: var(--r-ctl); border: 1px solid var(--line2); background: var(--panel2); color: var(--text);
         padding: 9px 16px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
  .btn:hover { border-color: var(--line3); background: var(--panel3); }
  .btn.primary { background: var(--orange); border-color: var(--orange2); color: var(--on-orange); font-weight: 700; }
  .warn { margin-top: 10px; padding: 10px 13px; border-radius: var(--r-card); font-size: 14px;
          border: 1px solid var(--warnline); background: var(--warnbg); color: var(--warnfg); }
  .warn.err { border-color: var(--red); background: var(--redbg); color: var(--redfg); }
  .warn:empty { display: none; }

  /* on screen: real-size paper you can scroll sideways on a phone */
  .preview { overflow-x: auto; padding: 0 16px 40px; }
  .sheet { width: 8.5in; min-height: 11in; margin: 0 auto 24px; padding: .5in; background: #fff; color: #000;
           box-shadow: var(--shadow-2); }
  .grid { display: grid; grid-template-columns: repeat(4, var(--tile-w)); grid-auto-rows: var(--tile-h); }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: .1in;
          outline: 1px dashed #c8c8c8; outline-offset: -.5px; overflow: hidden; break-inside: avoid; }
  .tile img { width: var(--qr); height: var(--qr); display: block; image-rendering: pixelated; }
  .tile .name { font: 700 11pt/1.15 -apple-system, system-ui, Helvetica, Arial, sans-serif; text-align: center; padding: 0 .08in;
                margin-top: .03in; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .id { font: 6.5pt/1.2 ui-monospace, Menlo, monospace; color: #555; margin-top: .02in; }

  @page { size: letter; margin: .5in; }
  @media print {
    body { background: #fff; }
    body::before, .toolbar { display: none; }
    .preview { padding: 0; overflow: visible; }
    .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; break-after: page; }
    .sheet:last-child { break-after: auto; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <div class="row">
    <h1>🏷️ Labels</h1>
    <a class="btn" href="/containers">← Containers</a>
    <button type="button" class="btn primary" id="print">🖨 Print</button>
  </div>
  <p id="summary">Loading…</p>
  <div class="warn" id="warn" role="status"></div>
</header>
<main class="preview" id="sheets"></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PER_SHEET = 20;   // 4 columns x 5 rows on US letter

(async () => {
  const ids = (new URLSearchParams(location.search).get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
  let data;
  try { data = await (await fetch('/api/containers', { cache: 'no-store' })).json(); }
  catch (e) { $('summary').textContent = "Couldn't load containers: " + e.message; return; }
  const byId = Object.fromEntries((data.containers || []).map(c => [c.id, c]));
  const list = ids.map(id => byId[id]).filter(Boolean);
  const missing = ids.filter(id => !byId[id]);
  const base = data.label_base_url || location.origin;

  const sheets = Math.ceil(list.length / PER_SHEET);
  $('summary').innerHTML = list.length
    ? `${list.length} label${list.length === 1 ? '' : 's'} on ${sheets} US letter sheet${sheets === 1 ? '' : 's'}. `
      + `Each code opens <code>${esc(base)}/c/&lt;id&gt;</code>: the capture page with that container selected.`
    : 'No containers selected. <a href="/containers">Pick some on the Containers page</a>.';

  const warns = [];
  const host = (() => { try { return new URL(base).hostname; } catch (e) { return ''; } })();
  if (/^(localhost|127\.|0\.0\.0\.0|\[?::1\]?$)/.test(host)) {
    warns.push(`These labels point at <code>${esc(base)}</code>, which a phone cannot reach. Start the server with INVENTORY_BASE_URL set to an address your phone can open.`);
  }
  if (missing.length) warns.push(`Skipped unknown container id${missing.length === 1 ? '' : 's'}: ${missing.map(esc).join(', ')}.`);
  $('warn').innerHTML = warns.join('<br>');
  $('warn').classList.toggle('err', warns.length > 0 && /cannot reach/.test(warns[0]));

  let html = '';
  for (let s = 0; s < list.length; s += PER_SHEET) {
    html += `<section class="sheet"><div class="grid">` + list.slice(s, s + PER_SHEET).map(c => `
      <div class="tile">
        <img src="/api/qr?container=${encodeURIComponent(c.id)}" alt="QR code for ${esc(c.path)}">
        <div class="name">${esc(c.name)}</div>
        <div class="id">${esc(c.id)}</div>
      </div>`).join('') + `</div></section>`;
  }
  $('sheets').innerHTML = html;
})();
$('print').addEventListener('click', () => window.print());
</script>
</body>
</html>
